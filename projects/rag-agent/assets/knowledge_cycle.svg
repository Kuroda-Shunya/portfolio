<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
    <linearGradient id="grad-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#1e8e3e"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#d32f2f"/>
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4285F4"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34A853"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FBBC05"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9c27b0"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9e9e9e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="16" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">🔄 Human-in-the-loop ナレッジ成長サイクル</text>

  <!-- ===== ROW 1: Main flow ===== -->

  <!-- Step 1: User Question -->
  <g filter="url(#shadow)">
    <rect x="40" y="80" width="180" height="80" rx="12" fill="url(#grad-blue)"/>
    <text x="130" y="112" text-anchor="middle" font-size="24" fill="white">👤</text>
    <text x="130" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="white">Slackで質問</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="220" y1="120" x2="278" y2="120" stroke="#4285F4" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Step 2: AI Answer -->
  <g filter="url(#shadow)">
    <rect x="280" y="80" width="180" height="80" rx="12" fill="url(#grad-green)"/>
    <text x="370" y="112" text-anchor="middle" font-size="24" fill="white">🤖</text>
    <text x="370" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="white">AIが自動回答</text>
  </g>

  <!-- Branch: Resolved -->
  <line x1="460" y1="100" x2="538" y2="100" stroke="#34A853" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <g filter="url(#shadow)">
    <rect x="540" y="72" width="140" height="56" rx="10" fill="#e8f5e9" stroke="#34A853" stroke-width="2"/>
    <text x="610" y="96" text-anchor="middle" font-size="14" fill="#1e8e3e">✅ 解決した</text>
    <text x="610" y="116" text-anchor="middle" font-size="11" fill="#2e7d32">→ ナレッジに保存</text>
  </g>

  <!-- Branch: Escalate -->
  <line x1="460" y1="140" x2="538" y2="140" stroke="#EA4335" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <g filter="url(#shadow)">
    <rect x="540" y="112" width="140" height="56" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="610" y="136" text-anchor="middle" font-size="14" fill="#e65100">🚨 未解決</text>
    <text x="610" y="156" text-anchor="middle" font-size="11" fill="#bf360c">→ 担当者へエスカレ</text>
  </g>

  <!-- Arrow from Escalate down -->
  <line x1="610" y1="168" x2="610" y2="218" stroke="#ff9800" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <!-- ===== ROW 2: Human Response ===== -->

  <!-- Step 3: Human responds -->
  <g filter="url(#shadow)">
    <rect x="520" y="220" width="180" height="80" rx="12" fill="url(#grad-orange)"/>
    <text x="610" y="252" text-anchor="middle" font-size="24" fill="white">🧑‍💻</text>
    <text x="610" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="white">担当者が対応・回答</text>
  </g>

  <!-- Arrow Human→Analysis -->
  <line x1="520" y1="260" x2="462" y2="260" stroke="#9c27b0" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- Step 4: AI Analysis -->
  <g filter="url(#shadow)">
    <rect x="280" y="220" width="180" height="80" rx="12" fill="url(#grad-purple)"/>
    <text x="370" y="252" text-anchor="middle" font-size="24" fill="white">🧠</text>
    <text x="370" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="white">AIが差分を分析</text>
  </g>

  <!-- Arrow Analysis→Update -->
  <line x1="280" y1="260" x2="222" y2="260" stroke="#9c27b0" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- Step 5: Knowledge Update -->
  <g filter="url(#shadow)">
    <rect x="40" y="220" width="180" height="80" rx="12" fill="url(#grad-red)"/>
    <text x="130" y="252" text-anchor="middle" font-size="24" fill="white">📚</text>
    <text x="130" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="white">ナレッジベース更新</text>
  </g>

  <!-- Arrow: Feedback loop back up (Knowledge → AI) -->
  <path d="M 40 260 Q -10 260 -10 120 Q -10 80 40 120" fill="none" stroke="#34A853" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="8" y="190" text-anchor="middle" font-size="11" fill="#34A853" transform="rotate(-90, 8, 190)">学習・改善</text>

  <!-- ===== Analysis Detail Box ===== -->
  <g filter="url(#shadow)">
    <rect x="40" y="340" width="820" height="160" rx="12" fill="white" stroke="#e0e0e0" stroke-width="1"/>
    <text x="450" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">🧠 AIが自動分析する内容</text>

    <!-- Analysis items -->
    <g transform="translate(60, 390)">
      <rect width="230" height="90" rx="8" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
      <text x="115" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#6a1b9a">❓ 不足情報の特定</text>
      <text x="115" y="50" text-anchor="middle" font-size="11" fill="#4a148c">「なぜAIが答えられなかったか」</text>
      <text x="115" y="68" text-anchor="middle" font-size="11" fill="#4a148c">を原因分析</text>
    </g>

    <g transform="translate(335, 390)">
      <rect width="230" height="90" rx="8" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
      <text x="115" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#1b5e20">📝 追記内容の生成</text>
      <text x="115" y="50" text-anchor="middle" font-size="11" fill="#1b5e20">担当者の回答から</text>
      <text x="115" y="68" text-anchor="middle" font-size="11" fill="#1b5e20">マニュアル追記文を自動生成</text>
    </g>

    <g transform="translate(610, 390)">
      <rect width="230" height="90" rx="8" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
      <text x="115" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#0d47a1">📍 追記先の提案</text>
      <text x="115" y="50" text-anchor="middle" font-size="11" fill="#0d47a1">どのマニュアルの</text>
      <text x="115" y="68" text-anchor="middle" font-size="11" fill="#0d47a1">どの見出しに追記すべきか提案</text>
    </g>
  </g>
</svg>
