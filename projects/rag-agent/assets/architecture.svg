<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#757575"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4285F4"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34A853"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" rx="16" fill="#fafafa"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">🏗️ システムアーキテクチャ</text>

  <!-- ===== LEFT: Slack Client ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="180" width="140" height="200" rx="12" fill="#4A154B"/>
    <text x="100" y="215" text-anchor="middle" font-size="28" fill="white">💬</text>
    <text x="100" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="white">Slack</text>
    <line x1="50" y1="260" x2="150" y2="260" stroke="#ffffff40" stroke-width="1"/>
    <text x="100" y="285" text-anchor="middle" font-size="10" fill="#e1bee7">ユーザーが質問</text>
    <text x="100" y="302" text-anchor="middle" font-size="10" fill="#e1bee7">✅ 解決ボタン</text>
    <text x="100" y="319" text-anchor="middle" font-size="10" fill="#e1bee7">🚨 エスカレボタン</text>
    <text x="100" y="336" text-anchor="middle" font-size="10" fill="#e1bee7">📊 分析リクエスト</text>
    <text x="100" y="365" text-anchor="middle" font-size="9" fill="#ce93d8">Events API / Web API</text>
  </g>

  <!-- Arrow: Slack ↔ Cloud Run -->
  <line x1="170" y1="270" x2="218" y2="270" stroke="#4285F4" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="218" y1="290" x2="170" y2="290" stroke="#4285F4" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- ===== CENTER: Google Cloud ===== -->
  <g>
    <!-- Cloud boundary -->
    <rect x="220" y="60" width="500" height="480" rx="16" fill="white" stroke="#4285F4" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="470" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#4285F4">☁️ Google Cloud</text>

    <!-- Cloud Run -->
    <g filter="url(#shadow)">
      <rect x="250" y="120" width="160" height="70" rx="10" fill="#e3f2fd" stroke="#4285F4" stroke-width="1.5"/>
      <text x="330" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1565c0">Cloud Run</text>
      <text x="330" y="170" text-anchor="middle" font-size="10" fill="#1976d2">Starlette + Slack Bolt</text>
    </g>

    <!-- Arrow: Cloud Run → Root Agent -->
    <line x1="330" y1="190" x2="330" y2="228" stroke="#757575" stroke-width="2" marker-end="url(#arr)"/>

    <!-- ADK Agents Box -->
    <rect x="250" y="230" width="440" height="160" rx="12" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
    <text x="470" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#616161">Google ADK (Agent Development Kit)</text>

    <!-- Root Agent -->
    <g filter="url(#shadow)">
      <rect x="270" y="270" width="130" height="55" rx="8" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
      <text x="335" y="293" text-anchor="middle" font-size="12" font-weight="600" fill="#f57f17">🧭 Root Agent</text>
      <text x="335" y="313" text-anchor="middle" font-size="9" fill="#f9a825">ルーティング</text>
    </g>

    <!-- Arrow Root→Responder -->
    <line x1="400" y1="285" x2="438" y2="275" stroke="#757575" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Arrow Root→Analyzer -->
    <line x1="400" y1="310" x2="438" y2="340" stroke="#757575" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Responder Agent -->
    <g filter="url(#shadow)">
      <rect x="440" y="260" width="130" height="55" rx="8" fill="#e8f5e9" stroke="#34A853" stroke-width="1.5"/>
      <text x="505" y="283" text-anchor="middle" font-size="12" font-weight="600" fill="#1b5e20">🤖 Responder</text>
      <text x="505" y="303" text-anchor="middle" font-size="9" fill="#2e7d32">RAG検索 + 回答生成</text>
    </g>

    <!-- Analyzer Agent -->
    <g filter="url(#shadow)">
      <rect x="440" y="330" width="130" height="55" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.5"/>
      <text x="505" y="353" text-anchor="middle" font-size="12" font-weight="600" fill="#6a1b9a">🧠 Analyzer</text>
      <text x="505" y="373" text-anchor="middle" font-size="9" fill="#7b1fa2">差分分析 + 改善提案</text>
    </g>

    <!-- Arrow Responder ↔ Vector Store -->
    <line x1="570" y1="287" x2="608" y2="287" stroke="#34A853" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Vector Search -->
    <g filter="url(#shadow)">
      <rect x="610" y="260" width="100" height="55" rx="8" fill="#e8f5e9" stroke="#34A853" stroke-width="1.5"/>
      <text x="660" y="283" text-anchor="middle" font-size="11" font-weight="600" fill="#1b5e20">🔍 Vector</text>
      <text x="660" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#1b5e20">Search</text>
      <text x="660" y="313" text-anchor="middle" font-size="8" fill="#2e7d32">NumPy / VAS</text>
    </g>

    <!-- ===== Bottom: Infra Services ===== -->
    <g filter="url(#shadow)">
      <rect x="260" y="420" width="100" height="50" rx="8" fill="#e3f2fd" stroke="#4285F4" stroke-width="1"/>
      <text x="310" y="442" text-anchor="middle" font-size="10" font-weight="600" fill="#1565c0">🔐 Secret</text>
      <text x="310" y="458" text-anchor="middle" font-size="10" font-weight="600" fill="#1565c0">Manager</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="380" y="420" width="100" height="50" rx="8" fill="#e3f2fd" stroke="#4285F4" stroke-width="1"/>
      <text x="430" y="442" text-anchor="middle" font-size="10" font-weight="600" fill="#1565c0">⏱️ Cloud</text>
      <text x="430" y="458" text-anchor="middle" font-size="10" font-weight="600" fill="#1565c0">Scheduler</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="500" y="420" width="100" height="50" rx="8" fill="#e3f2fd" stroke="#4285F4" stroke-width="1"/>
      <text x="550" y="442" text-anchor="middle" font-size="10" font-weight="600" fill="#1565c0">🛡️ IAM</text>
      <text x="550" y="458" text-anchor="middle" font-size="10" fill="#1976d2">アクセス管理</text>
    </g>

    <!-- Gemini API -->
    <g filter="url(#shadow)">
      <rect x="610" y="120" width="100" height="70" rx="10" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/>
      <text x="660" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#283593">✨ Gemini</text>
      <text x="660" y="168" text-anchor="middle" font-size="9" fill="#3f51b5">回答生成</text>
      <text x="660" y="180" text-anchor="middle" font-size="9" fill="#3f51b5">Embeddings</text>
    </g>

    <!-- Arrow Cloud Run ↔ Gemini -->
    <line x1="410" y1="148" x2="608" y2="148" stroke="#3f51b5" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- ===== RIGHT: Data Sources ===== -->
  <g>
    <rect x="750" y="100" width="180" height="380" rx="12" fill="white" stroke="#FBBC05" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="840" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#f9a825">📁 データソース</text>

    <g filter="url(#shadow)">
      <rect x="770" y="150" width="140" height="55" rx="8" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
      <text x="840" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#f57f17">📄 Google Drive</text>
      <text x="840" y="195" text-anchor="middle" font-size="9" fill="#f9a825">マニュアル / PDF</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="770" y="225" width="140" height="55" rx="8" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
      <text x="840" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#f57f17">📊 Sheets</text>
      <text x="840" y="270" text-anchor="middle" font-size="9" fill="#f9a825">Q&amp;A / 用語集 / ログ</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="770" y="300" width="140" height="55" rx="8" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
      <text x="840" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="#f57f17">📝 Google Docs</text>
      <text x="840" y="345" text-anchor="middle" font-size="9" fill="#f9a825">ナレッジ記事</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="770" y="375" width="140" height="55" rx="8" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/>
      <text x="840" y="400" text-anchor="middle" font-size="12" font-weight="600" fill="#283593">☁️ GCS</text>
      <text x="840" y="420" text-anchor="middle" font-size="9" fill="#3f51b5">ベクトルデータ / JSONL</text>
    </g>
  </g>

  <!-- Arrow: Vector Search ↔ Data Sources -->
  <line x1="710" y1="287" x2="768" y2="260" stroke="#34A853" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>
  <line x1="710" y1="287" x2="768" y2="320" stroke="#34A853" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>
</svg>
